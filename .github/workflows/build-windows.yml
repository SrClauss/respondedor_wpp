name: Build Windows App (Tauri)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies in wpp_server
        run: |
          cd wpp_server
          npm install

      - name: Install dependencies in frontend
        run: |
          cd frontend
          npm install

      - name: Package wpp_server sidecar for Windows
        run: |
          npx @yao-pkg/pkg wpp_server/index.js --target node20-win-x64 --output src-tauri/binaries/wpp_server-x86_64-pc-windows-msvc.exe

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Orquestrador WPP v__VERSION__'
          releaseBody: 'Instalador oficial do Orquestrador WPP para Windows (Tauri)'
          releaseDraft: false
          prerelease: false

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
